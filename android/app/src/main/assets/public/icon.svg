<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="50%" stop-color="#fcedea" />
      <stop offset="100%" stop-color="#ebd2cb" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e27387" />
      <stop offset="50%" stop-color="#cc4e64" />
      <stop offset="100%" stop-color="#9f2d44" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2d0" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#997819" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#e8cbbd" stroke-width="2" opacity="0.6" stroke-dasharray="6,6" />

  <!-- Morning Sunrise Sun Arc behind heart -->
  <path d="M 176 270 A 80 80 0 0 1 336 270" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.75" />
  <circle cx="256" cy="190" r="14" fill="url(#goldGrad)" opacity="0.8" filter="url(#softGlow)" />
  
  <!-- Rays -->
  <line x1="256" y1="160" x2="256" y2="146" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="220" y1="174" x2="210" y2="164" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="292" y1="174" x2="302" y2="164" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Interlocking Hearts for Two People -->
  <!-- Main Romantic Heart -->
  <path d="M 256 385 C 256 385 140 310 140 220 C 140 170 176 140 216 140 C 242 140 256 160 256 160 C 256 160 270 140 296 140 C 336 140 372 170 372 220 C 372 310 256 385 256 385 Z"
        fill="url(#heartGrad)" filter="url(#softGlow)" />
        
  <!-- Subtle highlight on heart -->
  <path d="M 170 205 C 160 230 170 260 190 280" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.35" />

  <!-- Musical note subtle accent (whispering melody) -->
  <g transform="translate(325, 200) scale(0.9)" opacity="0.9">
    <ellipse cx="14" cy="24" rx="7" ry="5" fill="#fdf2d0" transform="rotate(-20 14 24)" />
    <line x1="19" y1="22" x2="19" y2="5" stroke="#fdf2d0" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 19 5 C 24 5 28 8 29 13" fill="none" stroke="#fdf2d0" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
